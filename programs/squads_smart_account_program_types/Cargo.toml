[package]
name = "squads-smart-account-program-types"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Pure data types for the Squads Smart Account Program"

[lib]
name = "squads_smart_account_program_types"
crate-type = ["lib"]

[features]
default = ["borsh"]
borsh = ["dep:borsh"]
anchor = ["borsh", "dep:anchor-lang"]
testing = []

[dependencies]
solana-program = { version = "1.17.4", default-features = false }
borsh = { version = "0.10.3", optional = true }
anchor-lang = { version = "=0.29.0", optional = true, features = ["allow-missing-optionals"] }
thiserror = "1"
