[workspace]

[package]
name = "squads-smart-account-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Squads Smart Account Program"
license-file = "../../LICENSE"

[lib]
name = "squads_smart_account_client"

[dependencies]
borsh = { version = "1", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
solana-account-info = "~3.1"
solana-address = { version = "~2.6", features = ["borsh", "copy", "curve25519", "decode"] }
solana-cpi = "~3.1"
solana-instruction = "~3.4"
solana-program-error = "~3.0"
thiserror = "2"

# Optional integrations gated by the corresponding feature in codama-generated
# code. None are required for default builds.
anchor-lang = { version = "~0.31", optional = true }
serde = { version = "1", optional = true }
solana-account = { version = "~3.0", optional = true }
solana-rpc-client = { version = "^3.0", optional = true }

# Granular solana-* crates gated by `tx-builder`. Pulling these in granularly
# avoids the entire `solana-sdk` umbrella dep, which would balloon the build.
solana-hash = { version = "~3.1", optional = true }
solana-message = { version = "~3.1", optional = true }
solana-transaction = { version = "~3.1", optional = true }

[features]
default = ["helpers"]
anchor = ["dep:anchor-lang"]
anchor-idl-build = ["anchor", "anchor-lang?/idl-build"]
fetch = ["dep:solana-account", "dep:solana-rpc-client"]
serde = ["dep:serde"]

# Hand-written helpers layered on top of the codama-generated wire layer.
# Lives in src/helpers/ and is preserved across `yarn generate:sdk` runs.
helpers = []
ephemeral-signers = ["helpers"]
tx-builder = ["helpers", "dep:solana-hash", "dep:solana-message", "dep:solana-transaction"]
